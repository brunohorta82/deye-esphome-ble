number:
  # 0 = permanently connected (real-time, but Deye Cloud sync stalls)
  # >0 = disconnect after each poll, reconnect after N seconds (cloud coexists)
  - platform: template
    name: 'BLE Reconnect Interval'
    id: ble_reconnect_interval
    unit_of_measurement: 's'
    icon: mdi:bluetooth-connect
    min_value: 0
    max_value: 600
    step: 10
    restore_value: true
    initial_value: 0
    optimistic: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == 0 && !id(deye_ble).connected();'
            then:
              - lambda: |-
                  id(ble_reconnect_counter) = 0;
                  ESP_LOGI("deye", "Reconnect interval set to 0 while disconnected — reconnecting immediately");
              - switch.turn_on: inverter_ble_switch

switch:
  - platform: ble_client
    ble_client_id: deye_ble
    name: 'Inverter BLE Connection'
    id: inverter_ble_switch
    icon: mdi:bluetooth-connect
    restore_mode: RESTORE_DEFAULT_ON
    internal: true
